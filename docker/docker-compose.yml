# =============================================================================
# 云购生活新零售企业 —— 企业级数据仓库与经营分析可视化系统
# Docker Compose 编排：MySQL（Metastore 元数据库）+ Hive Metastore + HiveServer2
# -----------------------------------------------------------------------------
# 文件    : docker/docker-compose.yml
# 作者    : 张宇翔
# 启动    : cd docker && docker-compose up -d
# 停止    : cd docker && docker-compose down
# 查看    : docker-compose ps / docker-compose logs -f hive-server
#
# 【为什么用 apache/hive 4.0.0 官方镜像】
#   该镜像通过 SERVICE_NAME 环境变量区分组件角色（metastore / hiveserver2），
#   一个镜像同时承担两个角色，配置项集中在 SERVICE_OPTS 中。
#   注意：Hive 4.0 与 3.x 的镜像环境变量完全不同，网上 3.x 的 HIVE_SITE_CONF_* 写法在此无效。
#
# 【端口规划】本机 3306 已被本地 MySQL80 服务占用，故 MySQL 容器映射到 3307。
#   容器之间仍通过服务名 + 容器端口 3306 通信，宿主机端口仅用于外部访问。
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # MySQL：Hive Metastore 的元数据库（存放库表结构、分区等元信息，不存业务数据）
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-metastore_db}
      TZ: Asia/Shanghai
    ports:
      # 宿主机 3307 → 容器 3306（避开本地 MySQL80 占用的 3306）
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Metastore 必须在 MySQL 可接受连接后才能启动，此处用 mysqladmin ping 探活
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - ydsh

  # ---------------------------------------------------------------------------
  # Hive Metastore：元数据服务，端口 9083
  #   首次启动会自动执行 schematool -initSchema 初始化元数据库表结构
  #   因此不设 IS_RESUME（设了会跳过初始化，导致表结构不存在）
  # ---------------------------------------------------------------------------
  hive-metastore:
    image: apache/hive:4.0.0
    container_name: hive-metastore
    restart: on-failure:3
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: mysql
      TZ: Asia/Shanghai
      # MySQL 8 连接串必须带 allowPublicKeyRetrieval=true，
      # 否则驱动会因 caching_sha2_password 认证方式报 "Public Key Retrieval is not allowed"
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=com.mysql.cj.jdbc.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-metastore_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
        -Djavax.jdo.option.ConnectionUserName=root
        -Djavax.jdo.option.ConnectionPassword=${MYSQL_ROOT_PASSWORD:-root}
        -Dhive.metastore.warehouse.dir=/opt/hive/data/warehouse
    ports:
      - "9083:9083"
    volumes:
      # MySQL JDBC 驱动：Hive 镜像内只自带 Derby，必须外挂 MySQL 驱动才能连 MySQL
      - ./jdbc/mysql-connector-j-8.4.0.jar:/opt/hive/lib/mysql-connector-j.jar:ro
      # 数仓数据目录（元数据指向此处，需与 hive-server 共享同一个卷）
      - hive_warehouse:/opt/hive/data/warehouse
    networks:
      - ydsh

  # ---------------------------------------------------------------------------
  # HiveServer2：SQL 服务，JDBC 端口 10000，Web UI 端口 10002
  #   IS_RESUME=true 表示跳过 schema 初始化（由 metastore 容器负责）
  #   通过 hive.metastore.uris 指向 metastore 服务，实现元数据共享
  # ---------------------------------------------------------------------------
  hive-server:
    image: apache/hive:4.0.0
    container_name: hive-server
    restart: on-failure:3
    depends_on:
      - hive-metastore
    environment:
      SERVICE_NAME: hiveserver2
      IS_RESUME: "true"
      TZ: Asia/Shanghai
      SERVICE_OPTS: >-
        -Dhive.metastore.uris=thrift://hive-metastore:9083
        -Dhive.server2.thrift.bind.host=0.0.0.0
        -Dhive.server2.enable.doAs=false
    ports:
      - "10000:10000"   # beeline / JDBC
      - "10002:10002"   # HiveServer2 Web UI
    volumes:
      - ./jdbc/mysql-connector-j-8.4.0.jar:/opt/hive/lib/mysql-connector-j.jar:ro
      - hive_warehouse:/opt/hive/data/warehouse
      # 原始 CSV 挂载到容器 /data，供 LOAD DATA LOCAL INPATH 使用。
      # 注意："local" 指容器内路径，不是宿主机路径。
      # 若因宿主机路径含中文导致挂载失败，改用 docker cp 兜底（见 docs/01_环境搭建笔记.md）
      - ../data:/data:ro
    networks:
      - ydsh

networks:
  ydsh:
    name: ydsh-net

volumes:
  # 元数据库数据：持久化 Hive 表结构，容器重建不丢失
  mysql_data:
    name: ydsh-mysql-data
  # 数仓数据目录：持久化 Hive 表的实际数据文件
  hive_warehouse:
    name: ydsh-hive-warehouse
