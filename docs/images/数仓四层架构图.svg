<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="880" viewBox="0 0 1000 880" font-family="Microsoft YaHei, PingFang SC, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#CBD5E1"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="880" fill="#F8FAFC"/>

  <!-- 标题 -->
  <text x="60" y="42" font-size="21" font-weight="700" fill="#1F2937">云购生活企业级数据仓库 · 四层架构</text>
  <text x="60" y="65" font-size="12.5" fill="#64748B">ODS 贴源 → DWD 明细（星型模型）→ DWS 汇总 → ADS 应用　｜　数据量 115,209 行，2024 全年</text>

  <!-- 数据源 -->
  <rect x="60" y="88" width="620" height="58" rx="10" fill="#EEF2F7" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="80" y="112" font-size="13.5" font-weight="700" fill="#334155">数据源</text>
  <text x="80" y="132" font-size="12" fill="#475569">6 张业务 CSV：user 1,000 ｜ product 600 ｜ store 60 ｜ order 15,600 ｜ order_item 37,549 ｜ behavior 60,000</text>
  <line x1="370" y1="146" x2="370" y2="172" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="378" y="164" font-size="11" fill="#64748B">LOAD DATA · CRLF→LF · 去 BOM</text>

  <!-- ODS -->
  <rect x="60" y="176" width="620" height="96" rx="10" fill="#EAF2FB" stroke="#7BA7D9" stroke-width="1.6"/>
  <text x="80" y="200" font-size="14" font-weight="700" fill="#1D4ED8">ODS 贴源层</text>
  <text x="168" y="200" font-size="11.5" fill="#3B6FA8">ods_*　｜　原样接入，不做任何清洗　｜　TEXTFILE</text>
  <g font-size="11.5" fill="#1E3A5F">
    <rect x="80" y="212" width="138" height="26" rx="5" fill="#FFFFFF" stroke="#A9C4E4"/><text x="90" y="229">ods_user</text>
    <rect x="226" y="212" width="138" height="26" rx="5" fill="#FFFFFF" stroke="#A9C4E4"/><text x="236" y="229">ods_product</text>
    <rect x="372" y="212" width="138" height="26" rx="5" fill="#FFFFFF" stroke="#A9C4E4"/><text x="382" y="229">ods_store</text>
    <rect x="518" y="212" width="142" height="26" rx="5" fill="#FFFFFF" stroke="#A9C4E4"/><text x="528" y="229">ods_order</text>
    <rect x="80" y="242" width="138" height="26" rx="5" fill="#FFFFFF" stroke="#A9C4E4"/><text x="90" y="259">ods_order_item</text>
    <rect x="226" y="242" width="270" height="26" rx="5" fill="#FFFFFF" stroke="#A9C4E4"/><text x="236" y="259">ods_user_behavior</text>
  </g>

  <line x1="370" y1="272" x2="370" y2="298" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="378" y="290" font-size="11" fill="#64748B">清洗 · 标准化 · 去重 · 维度关联</text>

  <!-- DWD -->
  <rect x="60" y="302" width="620" height="222" rx="10" fill="#EAF7EF" stroke="#6FBF8E" stroke-width="1.6"/>
  <text x="80" y="326" font-size="14" font-weight="700" fill="#15803D">DWD 明细层</text>
  <text x="168" y="326" font-size="11.5" fill="#2F7A52">dim_* / dwd_*　｜　星型模型，一行 = 一条业务记录　｜　ORC + SNAPPY</text>

  <text x="80" y="350" font-size="11" font-weight="700" fill="#166534">业务维度</text>
  <g font-size="11.5" fill="#14532D">
    <rect x="140" y="336" width="112" height="24" rx="5" fill="#FFFFFF" stroke="#8FD0AA"/><text x="150" y="352">dim_user 1,000</text>
    <rect x="260" y="336" width="118" height="24" rx="5" fill="#FFFFFF" stroke="#8FD0AA"/><text x="270" y="352">dim_product 600</text>
    <rect x="386" y="336" width="108" height="24" rx="5" fill="#FFFFFF" stroke="#8FD0AA"/><text x="396" y="352">dim_store 60</text>
    <rect x="502" y="336" width="112" height="24" rx="5" fill="#FFFFFF" stroke="#8FD0AA"/><text x="512" y="352">dim_date 366</text>
  </g>

  <text x="80" y="382" font-size="11" font-weight="700" fill="#166534">码表维度</text>
  <g font-size="11.5" fill="#14532D">
    <rect x="140" y="368" width="150" height="24" rx="5" fill="#FFFFFF" stroke="#8FD0AA"/><text x="150" y="384">dim_member_level</text>
    <rect x="298" y="368" width="130" height="24" rx="5" fill="#FFFFFF" stroke="#8FD0AA"/><text x="308" y="384">dim_pay_type</text>
    <rect x="436" y="368" width="178" height="24" rx="5" fill="#FFFFFF" stroke="#8FD0AA"/><text x="446" y="384">dim_order_status（GMV 口径）</text>
  </g>

  <text x="80" y="414" font-size="11" font-weight="700" fill="#166534">事实表</text>
  <g font-size="11.5" fill="#14532D">
    <rect x="140" y="400" width="212" height="26" rx="5" fill="#F0FDF4" stroke="#5CB87F" stroke-width="1.3"/><text x="150" y="417">dwd_order　15,000（12 分区）</text>
    <rect x="360" y="400" width="168" height="26" rx="5" fill="#F0FDF4" stroke="#5CB87F" stroke-width="1.3"/><text x="370" y="417">dwd_order_item　37,549</text>
    <rect x="536" y="400" width="122" height="26" rx="5" fill="#F0FDF4" stroke="#5CB87F" stroke-width="1.3"/><text x="546" y="417">dwd_user_behavior</text>
  </g>

  <line x1="269" y1="400" x2="269" y2="388" stroke="#5CB87F" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="80" y="446" font-size="11" fill="#2F7A52">分区策略：按年月 order_ym（12 个分区）—— 实测按天会产生 250+ 小分区，Tez 下反而更慢</text>
  <text x="80" y="480" font-size="11" fill="#2F7A52">可溯源：age_is_filled ｜ amt_fix_flag ｜ qty_is_fixed ｜ ods_dup_cnt ｜ price_is_fixed</text>
  <text x="80" y="504" font-size="11" fill="#2F7A52">存储：ORC + SNAPPY（较 TEXTFILE 体积约减 70%）</text>

  <line x1="370" y1="524" x2="370" y2="548" stroke="#CBD5E1" stroke-width="1.6" marker-end="url(#arrowMuted)"/>
  <text x="378" y="542" font-size="11" fill="#94A3B8">按主题轻度汇总（第 3 周）</text>

  <!-- DWS -->
  <rect x="60" y="552" width="620" height="72" rx="10" fill="#FDF6E9" stroke="#E0B36A" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="80" y="576" font-size="14" font-weight="700" fill="#B45309">DWS 汇总层</text>
  <text x="168" y="576" font-size="11.5" fill="#A16207">规划中　｜　日/月 + 维度聚合　｜　dws_trade_day · dws_user_agg</text>
  <text x="80" y="606" font-size="11" fill="#92400E">状态：第 3 周建设（当前 ydsh_dws 库已建，0 张表）</text>

  <line x1="370" y1="624" x2="370" y2="648" stroke="#CBD5E1" stroke-width="1.6" marker-end="url(#arrowMuted)"/>
  <text x="378" y="642" font-size="11" fill="#94A3B8">面向指标与报表</text>

  <!-- ADS -->
  <rect x="60" y="652" width="620" height="72" rx="10" fill="#FBECF1" stroke="#D98BA4" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="80" y="676" font-size="14" font-weight="700" fill="#9D174D">ADS 应用层</text>
  <text x="168" y="676" font-size="11.5" fill="#A83263">规划中　｜　指标级结果　｜　ads_kpi_overview · ads_category_sales</text>
  <text x="80" y="706" font-size="11" fill="#9D174D">状态：第 3～4 周建设（当前 ydsh_ads 库已建，0 张表）</text>

  <line x1="370" y1="724" x2="370" y2="748" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- BI -->
  <rect x="60" y="752" width="620" height="52" rx="10" fill="#F1EDFB" stroke="#A08CD1" stroke-width="1.5"/>
  <text x="80" y="775" font-size="13.5" font-weight="700" fill="#5B21B6">可视化层</text>
  <text x="170" y="775" font-size="12" fill="#6D4AA8">Apache Superset 仪表板　·　ECharts 数据大屏　·　Streamlit 问答界面</text>
  <text x="80" y="794" font-size="11" fill="#6D4AA8">统计指标：GMV 2,471.75 万元 ｜ 订单 9,992 单 ｜ 客单价 2,473.73 元</text>

  <!-- 右侧治理面板 -->
  <rect x="712" y="176" width="228" height="628" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.4"/>
  <text x="730" y="202" font-size="13.5" font-weight="700" fill="#1F2937">本层已交付资产</text>

  <text x="730" y="230" font-size="11" font-weight="700" fill="#15803D">DWD 层 · 10 张表</text>
  <text x="730" y="250" font-size="11" fill="#475569">4 业务维度 + 3 码表维度</text>
  <text x="730" y="268" font-size="11" fill="#475569">3 事实表（2 张按月分区）</text>

  <text x="730" y="298" font-size="11" font-weight="700" fill="#1D4ED8">质量治理 · 18 项检查</text>
  <text x="730" y="318" font-size="11" fill="#475569">修复脏值 36,204 条</text>
  <text x="730" y="336" font-size="11" fill="#475569">五类脏数据修复率 100%</text>
  <text x="730" y="354" font-size="11" fill="#475569">对比结果表 quality_compare</text>

  <line x1="730" y1="372" x2="922" y2="372" stroke="#E2E8F0"/>

  <text x="730" y="394" font-size="11" font-weight="700" fill="#B45309">五类脏数据分布</text>
  <text x="730" y="414" font-size="11" fill="#475569">格式不一致　28,385（78.4%）</text>
  <text x="730" y="432" font-size="11" fill="#475569">枚举不规范　 5,391（14.9%）</text>
  <text x="730" y="450" font-size="11" fill="#475569">异常值　　　 1,766（ 4.9%）</text>
  <text x="730" y="468" font-size="11" fill="#475569">重复值　　　　 600（ 1.7%）</text>
  <text x="730" y="486" font-size="11" fill="#475569">缺失值　　　　　62（ 0.2%）</text>

  <line x1="730" y1="504" x2="922" y2="504" stroke="#E2E8F0"/>

  <text x="730" y="526" font-size="11" font-weight="700" fill="#9D174D">关键口径</text>
  <text x="730" y="546" font-size="11" fill="#475569">GMV 只计 is_gmv_included=1</text>
  <text x="730" y="564" font-size="11" fill="#475569">已支付 + 已完成，9,992 单</text>
  <text x="730" y="582" font-size="11" fill="#475569">口径下沉到 dim_order_status</text>

  <line x1="730" y1="600" x2="922" y2="600" stroke="#E2E8F0"/>

  <text x="730" y="622" font-size="11" font-weight="700" fill="#334155">存储选型</text>
  <text x="730" y="642" font-size="11" fill="#475569">ODS　TEXTFILE（可回溯）</text>
  <text x="730" y="660" font-size="11" fill="#475569">DWD　ORC + SNAPPY</text>

  <line x1="730" y1="678" x2="922" y2="678" stroke="#E2E8F0"/>

  <text x="730" y="700" font-size="11" font-weight="700" fill="#334155">待建</text>
  <text x="730" y="720" font-size="11" fill="#8A94A6">DWS 汇总层（第 3 周）</text>
  <text x="730" y="738" font-size="11" fill="#8A94A6">ADS 应用层（第 3～4 周）</text>
  <text x="730" y="756" font-size="11" fill="#8A94A6">分桶表实验（演示级）</text>

  <text x="60" y="840" font-size="11" fill="#94A3B8">图例：实线 = 已交付　｜　虚线 = 规划中　｜　数据来源：ydsh_dwd（2024-11-02 实测）</text>
</svg>
